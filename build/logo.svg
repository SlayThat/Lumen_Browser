<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f2e"/>
      <stop offset=".55" stop-color="#0c3a63"/>
      <stop offset="1" stop-color="#0f7487"/>
    </linearGradient>
    <radialGradient id="warm" cx=".8" cy=".82" r=".62">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ff6f61" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx=".18" cy=".14" r=".55">
      <stop offset="0" stop-color="#63e6e2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#63e6e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gather" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d1" stop-opacity=".98"/>
      <stop offset=".35" stop-color="#ffb347" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1=".12" y1=".04" x2=".88" y2=".96">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="512" cy="512" r="296"/></clipPath>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#02050f" flood-opacity=".5"/></filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#warm)"/>
    <rect width="1024" height="1024" fill="url(#cool)"/>
    <!-- fine grid, like a test chart seen through the lens -->
    <g stroke="#fff" stroke-opacity=".07" stroke-width="2">
      <path d="M0 128H1024M0 256H1024M0 384H1024M0 512H1024M0 640H1024M0 768H1024M0 896H1024M128 0V1024M256 0V1024M384 0V1024M512 0V1024M640 0V1024M768 0V1024M896 0V1024"/>
    </g>
  </g>

  <!-- lens -->
  <g filter="url(#drop)">
    <circle cx="512" cy="512" r="296" fill="#0a1c3d" fill-opacity=".25"/>
  </g>
  <g clip-path="url(#lens)">
    <circle cx="512" cy="512" r="296" fill="#fff" fill-opacity=".09"/>
    <!-- light gathered by the lens, pulled toward the lower right -->
    <circle cx="600" cy="610" r="250" fill="url(#gather)"/>
    <!-- grid bent by the lens -->
    <g stroke="#fff" stroke-opacity=".16" stroke-width="3" fill="none">
      <path d="M256 330Q512 250 768 330"/><path d="M230 430Q512 360 794 430"/><path d="M216 540Q512 490 808 540"/><path d="M236 650Q512 640 788 650"/>
    </g>
    <!-- highlight crescent on the top left -->
    <path d="M262 470C262 330 370 232 512 232c40 0 78 8 112 24C520 262 420 330 380 440c-14 38-16 80-8 118-70-20-110-60-110-88z" fill="url(#spec)" opacity=".8" filter="url(#soft)"/>
  </g>

  <!-- chromatic fringe at the lower-right rim -->
  <path d="M742 668A296 296 0 0 1 538 806" fill="none" stroke="#ff4fa3" stroke-opacity=".55" stroke-width="12" stroke-linecap="round" transform="translate(7 5)"/>
  <path d="M742 668A296 296 0 0 1 538 806" fill="none" stroke="#3de0ff" stroke-opacity=".55" stroke-width="12" stroke-linecap="round" transform="translate(-6 -4)"/>

  <!-- rim -->
  <circle cx="512" cy="512" r="296" fill="none" stroke="url(#rim)" stroke-width="28"/>
  <circle cx="512" cy="512" r="270" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="4"/>

  <!-- point of light -->
  <circle cx="660" cy="372" r="16" fill="#fff" fill-opacity=".95"/>
  <circle cx="660" cy="372" r="38" fill="#fff" fill-opacity=".18" filter="url(#soft)"/>
</svg>
